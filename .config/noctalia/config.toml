[theme]
mode = "dark"
source = "custom"
custom_palette = "pywal"

[bar.default]
position = "top"
background_opacity = 0.7
margin_ends = 10
thickness = 34
scale = 1.3
font_scale = 0.75
# capsule = true
# capsule_fill = ""

start  = ["audio_visualizer", "media",  "clipboard", "tray", "notifications", "settings", "sysmon"]
center = ["control-center", "workspaces", "taskbar"]
end    = ["session", "volume", "network", "bluetooth",  "brightness", "battery", "clock", "lock_keys"]

[shell.panel]
transparency_mode = "soft"

[wallpaper]
enabled = false

[location]
auto_locate = true            # resolve coordinates from your IP address when true
# address     = "Boston, MA"    # geocoded when auto_locate = false and non-empty

[weather]
enabled         = true
refresh_minutes = 30
unit            = "metric"      # metric | imperial
effects         = true          # visual weather effects

[nightlight]
enabled = true
force = false
temperature_day = 6500
# why is it thinking its night????
temperature_night = 4000

[widget.updates]
type = "yuuto/arch-updater:widget"

[osd.kinds]
lock_keys = false

[dock]
enabled             = true      # set true to activate
position            = "bottom"   # top | bottom | left | right
active_monitor_only = false      # when true, only show apps/windows from the active monitor

show_running        = true       # also show running apps not in the pinned list
auto_hide           = true      # slide out when pointer leaves; reveal from edge trigger strip
smart_auto_hide     = false      # show when the active workspace is empty; hide when it has windows
reserve_space       = false       # reserve compositor exclusive zone / push windows away

pinned = []


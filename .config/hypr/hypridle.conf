general {
    lock_cmd = hyprlock          # dbus/sysd lock command (loginctl lock-session)
    # unlock_cmd = /home/alex/dotfiles/.config/hypr/scripts/randomize_background.py      # same as above, but unlock
    on_unlock_cmd = /home/alex/dotfiles/.config/hypr/scripts/randomize_background.py
    # before_sleep_cmd = umount Laptop-Server    # command ran before sleep
    # after_sleep_cmd = notify-send "Awake!"  # command ran after sleep
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors
}

listener {
    timeout = 9000 # in seconds
    on-timeout = hyprctl dispatch dpms off # command to run when timeout has passed
    on-resume = hyprctl dispatch dpms on  # command to run when activity is detected after timeout has fired.
}

